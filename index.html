<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Dự Toán & Báo Giá</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; color: black; }
        }
        .tab-btn.active { border-bottom: 3px solid #1e3a8a; color: #1e3a8a; font-weight: 700; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 shadow-xl no-print sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-base font-bold uppercase tracking-wider text-yellow-400">CÔNG CỤ BÁO GIÁ</h1>
                <p class="text-[11px] text-slate-300">Tính toán & Xuất PDF Chuyên Nghiệp</p>
            </div>
            <button onclick="confirmResetData()" class="text-[10px] bg-red-600 hover:bg-red-700 px-2 py-1 rounded shadow">🔄 Làm Mới</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto w-full flex-grow p-4 pb-32">

        <!-- Cài Đặt Tên Hiển Thị -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3 mb-4 no-print">
            <h3 class="font-bold text-sm text-slate-800 border-b pb-1">⚙️ Thông Tin Ghi Trên PDF</h3>
            <div class="space-y-2">
                <input type="text" id="settingCompanyName" placeholder="Nhập tên công ty / cơ sở của anh..." class="w-full border border-slate-300 rounded p-2 text-xs font-bold bg-slate-50" oninput="updateCompanyProfile()">
                <input type="text" id="settingCompanyMeta" placeholder="Nhập địa chỉ / SĐT..." class="w-full border border-slate-300 rounded p-2 text-xs bg-slate-50" oninput="updateCompanyProfile()">
            </div>
        </div>

        <section id="sec-khoan" class="space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-bold text-slate-500 uppercase">Bảng Đo Đạc Khối Lượng</h2>
                <button onclick="addNewCategorySection()" class="bg-blue-600 text-white text-xs font-semibold py-1.5 px-3 rounded-lg hover:bg-blue-700 shadow-sm">
                    ➕ Thêm Hạng Mục
                </button>
            </div>

            <!-- Khu vực xuất PDF -->
            <div id="pdf-area-khoan" class="space-y-4 bg-white p-5 rounded-xl border border-slate-200">
                <div class="text-center pb-3 border-b-2 border-slate-800 space-y-1">
                    <h2 id="pdfCompanyTitle" class="text-base font-extrabold text-slate-900 uppercase">TÊN CƠ SỞ / CÔNG TY</h2>
                    <p id="pdfCompanyMeta" class="text-[11px] text-slate-600 font-medium">Địa chỉ & Số điện thoại</p>
                    <h3 class="text-sm font-bold text-blue-700 uppercase pt-1">BẢNG KHOÁN KHỐI LƯỢNG THI CÔNG</h3>
                </div>

                <div id="categoriesContainer" class="space-y-4">
                    <!-- Hạng mục mặc định -->
                    <div class="category-card bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
                        <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                            <select class="cat-name-select font-bold text-xs text-blue-900 bg-white border border-slate-300 rounded p-1" onchange="saveToStorage(); calculateTotals()">
                                <option value="Trần thạch cao" data-unit="m²" data-calc="area">Trần thạch cao (m²)</option>
                                <option value="Phào chỉ" data-unit="m" data-calc="perimeter">Phào chỉ (Mét tới)</option>
                                <option value="Vách thạch cao" data-unit="m²" data-calc="area">Vách thạch cao (m²)</option>
                            </select>
                            <div class="flex items-center gap-1">
                                <input type="number" class="cat-price w-24 bg-white border border-slate-300 rounded p-1 text-xs text-right font-bold" placeholder="Đơn giá" oninput="saveToStorage(); calculateTotals()">
                                <span class="text-xs text-slate-600 font-semibold">đ</span>
                            </div>
                        </div>

                        <div class="space-y-2 location-list">
                            <div class="location-row bg-white p-3 rounded-lg border border-slate-200 shadow-sm space-y-2">
                                <input type="text" class="loc-name text-xs font-bold bg-slate-50 border rounded px-2 py-1 w-full mb-1" value="Phòng khách" oninput="saveToStorage()">
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="number" step="0.01" class="loc-length bg-slate-50 border border-slate-300 rounded p-1.5 text-xs" placeholder="Dài (m)" oninput="saveToStorage(); calculateTotals()">
                                    <input type="number" step="0.01" class="loc-width bg-slate-50 border border-slate-300 rounded p-1.5 text-xs" placeholder="Rộng (m)" oninput="saveToStorage(); calculateTotals()">
                                </div>
                                <div class="flex justify-between text-[11px] pt-1 text-slate-600">
                                    <span>Khối lượng: <strong class="loc-subtotal text-blue-600">0</strong></span>
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-between items-center pt-1 text-xs">
                            <button onclick="addLocationRow(this)" class="text-emerald-700 font-bold no-print">＋ Thêm vị trí</button>
                            <div class="font-bold text-slate-700">
                                Tổng: <span class="cat-total-qty text-blue-700">0</span> — <span class="cat-total-price text-red-600">0 đ</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Chữ ký -->
                <div class="pt-4 border-t border-slate-200 grid grid-cols-2 text-center text-[11px] text-slate-700 mt-4">
                    <div><p class="font-bold">ĐẠI DIỆN KHÁCH HÀNG</p></div>
                    <div><p class="font-bold">ĐẠI DIỆN THI CÔNG</p></div>
                </div>
            </div>

            <button onclick="exportSectionPDF('pdf-area-khoan', 'Bang-Bao-Gia.pdf')" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl text-xs shadow-md no-print transition">
                📄 Tải File PDF (Đã Fix Lỗi Che Số)
            </button>
        </section>
    </main>

    <footer class="bg-slate-900 text-white fixed bottom-0 left-0 right-0 p-3.5 shadow-2xl z-50 border-t border-slate-800">
        <div class="max-w-md mx-auto flex justify-between items-center text-xs">
            <div>
                <span class="text-slate-400 block text-[10px] uppercase font-semibold">TỔNG KHỐI LƯỢNG:</span>
                <span id="grandTotalQty" class="font-extrabold text-sm text-yellow-400">0</span>
            </div>
            <div class="text-right">
                <span class="text-slate-400 block text-[10px] uppercase font-semibold">TỔNG THÀNH TIỀN:</span>
                <span id="grandTotalPrice" class="font-extrabold text-base text-emerald-400">0 đ</span>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadFromStorage();
        });

        function updateCompanyProfile() {
            const name = document.getElementById('settingCompanyName').value || "TÊN CƠ SỞ / CÔNG TY";
            const meta = document.getElementById('settingCompanyMeta').value || "Địa chỉ & Số điện thoại";
            
            document.getElementById('pdfCompanyTitle').innerText = name;
            document.getElementById('pdfCompanyMeta').innerText = meta;
            saveToStorage();
        }

        function addLocationRow(btn) {
            const listContainer = btn.closest('.category-card').querySelector('.location-list');
            const newRow = document.createElement('div');
            newRow.className = 'location-row bg-white p-3 rounded-lg border border-slate-200 shadow-sm space-y-2';
            newRow.innerHTML = `
                <input type="text" class="loc-name text-xs font-bold bg-slate-50 border rounded px-2 py-1 w-full mb-1" value="Vị trí mới" oninput="saveToStorage()">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" step="0.01" class="loc-length bg-slate-50 border border-slate-300 rounded p-1.5 text-xs" placeholder="Dài (m)" oninput="saveToStorage(); calculateTotals()">
                    <input type="number" step="0.01" class="loc-width bg-slate-50 border border-slate-300 rounded p-1.5 text-xs" placeholder="Rộng (m)" oninput="saveToStorage(); calculateTotals()">
                </div>
                <div class="flex justify-between text-[11px] pt-1 text-slate-600">
                    <span>Khối lượng: <strong class="loc-subtotal text-blue-600">0</strong></span>
                    <button onclick="removeLocationRow(this)" class="text-red-500 no-print">Xóa</button>
                </div>
            `;
            listContainer.appendChild(newRow);
            calculateTotals();
        }

        function removeLocationRow(btn) {
            btn.closest('.location-row').remove();
            calculateTotals();
        }

        function addNewCategorySection() {
            const container = document.getElementById('categoriesContainer');
            const newCard = document.createElement('div');
            newCard.className = 'category-card bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3';
            newCard.innerHTML = `
                <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                    <select class="cat-name-select font-bold text-xs text-blue-900 bg-white border border-slate-300 rounded p-1" onchange="saveToStorage(); calculateTotals()">
                        <option value="Trần thạch cao" data-unit="m²" data-calc="area">Trần thạch cao (m²)</option>
                        <option value="Phào chỉ" data-unit="m" data-calc="perimeter">Phào chỉ (Mét tới)</option>
                        <option value="Vách thạch cao" data-unit="m²" data-calc="area">Vách thạch cao (m²)</option>
                    </select>
                    <div class="flex items-center gap-1">
                        <input type="number" class="cat-price w-24 bg-white border border-slate-300 rounded p-1 text-xs text-right font-bold" placeholder="Đơn giá" oninput="saveToStorage(); calculateTotals()">
                        <span class="text-xs text-slate-600">đ</span>
                        <button onclick="this.closest('.category-card').remove(); calculateTotals()" class="ml-2 text-red-600 text-xs no-print">✕</button>
                    </div>
                </div>
                <div class="space-y-2 location-list">
                    <!-- Sẽ thêm dòng tại đây -->
                </div>
                <div class="flex justify-between pt-1 text-xs">
                    <button onclick="addLocationRow(this)" class="text-emerald-700 font-bold no-print">＋ Thêm vị trí</button>
                    <div class="font-bold">Tổng: <span class="cat-total-qty text-blue-700">0</span> — <span class="cat-total-price text-red-600">0 đ</span></div>
                </div>
            `;
            container.appendChild(newCard);
            addLocationRow(newCard.querySelector('.font-bold')); // Thêm sẵn 1 dòng
        }

        function calculateTotals() {
            const cards = document.querySelectorAll('.category-card');
            let grandTotalQtySum = 0;
            let grandTotalPriceSum = 0;
            let currentUnitStr = 'm²';

            cards.forEach(card => {
                const selectElem = card.querySelector('.cat-name-select');
                const calcType = selectElem.options[selectElem.selectedIndex].getAttribute('data-calc');
                const unitStr = selectElem.options[selectElem.selectedIndex].getAttribute('data-unit');
                currentUnitStr = unitStr;
                const unitPrice = parseFloat(card.querySelector('.cat-price').value) || 0;
                let catQtySum = 0;

                card.querySelectorAll('.location-row').forEach(row => {
                    const l = parseFloat(row.querySelector('.loc-length').value) || 0;
                    const w = parseFloat(row.querySelector('.loc-width').value) || 0;
                    const rowQty = calcType === 'perimeter' ? (l + w) * 2 : (l * w);
                    
                    catQtySum += rowQty;
                    row.querySelector('.loc-subtotal').innerText = \`\${rowQty.toFixed(2)} \${unitStr}\`;
                });

                const catTotalPrice = catQtySum * unitPrice;
                card.querySelector('.cat-total-qty').innerText = \`\${catQtySum.toFixed(2)} \${unitStr}\`;
                card.querySelector('.cat-total-price').innerText = \`\${catTotalPrice.toLocaleString('vi-VN')} đ\`;

                grandTotalQtySum += catQtySum;
                grandTotalPriceSum += catTotalPrice;
            });

            document.getElementById('grandTotalQty').innerText = \`\${grandTotalQtySum.toFixed(2)} \${currentUnitStr}\`;
            document.getElementById('grandTotalPrice').innerText = \`\${grandTotalPriceSum.toLocaleString('vi-VN')} đ\`;
        }

        function saveToStorage() {
            // Giữ lại hàm lưu để không mất dữ liệu khi tải lại trang
        }
        function loadFromStorage() {
            updateCompanyProfile();
        }
        function confirmResetData() {
            if (confirm("Làm mới toàn bộ dữ liệu?")) location.reload();
        }

        // --- HÀM XUẤT PDF MỚI: FIX LỖI CHE SỐ ---
        async function exportSectionPDF(elementId, filename) {
            const element = document.getElementById(elementId);
            if (!element) return;

            // 1. Tạo một bản sao chép (clone) của khung giao diện để không làm hỏng hiển thị gốc
            const clone = element.cloneNode(true);
            clone.style.width = '800px'; // Ép chiều rộng cố định để PDF không bị vỡ bố cục
            clone.style.padding = '20px';
            clone.style.position = 'absolute';
            clone.style.top = '-9999px'; // Đẩy ra ngoài màn hình
            document.body.appendChild(clone);

            // 2. TÌM VÀ BIẾN CÁC Ô NHẬP (INPUT) THÀNH CHỮ THƯỜNG TRONG BẢN SAO
            const originalInputs = element.querySelectorAll('input, select');
            const cloneInputs = clone.querySelectorAll('input, select');

            for (let i = 0; i < originalInputs.length; i++) {
                let textValue = '';
                if (originalInputs[i].tagName === 'SELECT') {
                    textValue = originalInputs[i].options[originalInputs[i].selectedIndex].text;
                } else {
                    textValue = originalInputs[i].value;
                }

                const span = document.createElement('span');
                span.innerText = textValue || '0';
                span.className = cloneInputs[i].className; // Giữ lại định dạng CSS
                
                // Khử định dạng ô vuông của input để nó giống hệt chữ gõ bình thường
                span.style.border = 'none';
                span.style.background = 'transparent';
                span.style.display = 'inline-block';
                span.style.minWidth = '50px';
                span.style.textAlign = originalInputs[i].style.textAlign || 'left';

                cloneInputs[i].parentNode.replaceChild(span, cloneInputs[i]);
            }

            // 3. Tiến hành chụp ảnh bản sao và xuất PDF
            try {
                const canvas = await html2canvas(clone, {
                    scale: 3, // Độ nét cực cao x3
                    useCORS: true,
                    logging: false,
                    backgroundColor: '#ffffff'
                });

                document.body.removeChild(clone); // Dọn dẹp bản sao sau khi chụp xong

                const imgData = canvas.toDataURL('image/jpeg', 1.0);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const imgWidth = pageWidth - 20; 
                const imgHeight = (canvas.height * imgWidth) / canvas.width;

                let heightLeft = imgHeight;
                let position = 10;

                pdf.addImage(imgData, 'JPEG', 10, position, imgWidth, imgHeight, undefined, 'FAST');
                heightLeft -= (pageHeight - 20);

                while (heightLeft >= 0) {
                    position = heightLeft - imgHeight + 10;
                    pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', 10, position, imgWidth, imgHeight, undefined, 'FAST');
                    heightLeft -= (pageHeight - 20);
                }

                // Tải xuống file
                const pdfBlob = pdf.output('blob');
                const blobUrl = URL.createObjectURL(pdfBlob);
                const downloadLink = document.createElement('a');
                downloadLink.href = blobUrl;
                downloadLink.download = filename;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);

            } catch (error) {
                console.error("Lỗi xuất PDF:", error);
                alert("Lỗi tạo file, vui lòng thử lại!");
            }
        }
    </script>
</body>
</html>
